colors:
  body: NONE
  date: RED
  tags: YELLOW
  title: CYAN
default_hour: 9
default_minute: 0
editor: nvim
encrypt: false
highlight: true
indent_character: ' '
journals:
  default:
    display_format: json
    editor: vim -c 'set viminfo= noswapfile noundofile nobackup nowritebackup noshelltemp
      history=0 nomodeline secure'
    encrypt: true
    journal: ~/.jrnl/journal.txt
  study:
    editor: nvim -c 'set shada= noswapfile noundofile nobackup nowritebackup noshelltemp
      history=0 nomodeline secure'
    journal: ~/.jrnl/studies/
    template: ~/.jrnl/templates/asciidoc.adoc
  work: ~/.jrnl/work.md
  workout: ~/.jrnl/workouts.txt
linewrap: 79
tagsymbols: '#@'
template: false
timeformat: '%F %r'
version: '4.6'
